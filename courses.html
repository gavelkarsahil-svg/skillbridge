<!-- ===== SKILLBRIDGE VIDEO POPUP: paste this whole block in courses.html, after <script src="script.js"></script> ===== -->
<style>
  .sbv-btn{display:block;width:100%;text-align:center;margin-top:10px;padding:12px;border:2px solid #1c2a4a;border-radius:8px;background:transparent;font:inherit;font-weight:700;color:#1c2a4a;cursor:pointer}
  .sbv-btn.done{border-color:#1a9a5b;color:#1a9a5b}
  #sbvOverlay{position:fixed;inset:0;background:rgba(10,15,30,.75);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #sbvOverlay.open{display:flex}
  #sbvBox{background:#fff;color:#1b2333;border-radius:12px;width:100%;max-width:820px;padding:14px}
  #sbvHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  #sbvTitle{margin:0;font-size:1.1rem}
  #sbvClose{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:#1b2333}
  #sbvRatio{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
  #sbvRatio>div,#sbvRatio iframe{position:absolute;inset:0;width:100%;height:100%}
  #sbvBar{height:8px;background:#e2e5ee;border-radius:4px;overflow:hidden;margin:10px 0 6px}
  #sbvFill{display:block;height:100%;width:0;background:#2f5bea;transition:width .4s}
  #sbvStatus{font-size:.9rem;color:#6b7385}
</style>

<div id="sbvOverlay">
  <div id="sbvBox" role="dialog" aria-modal="true" aria-labelledby="sbvTitle">
    <div id="sbvHead"><h3 id="sbvTitle"></h3><button id="sbvClose" aria-label="Close video">×</button></div>
    <div id="sbvRatio"><div id="sbvPlayer"></div></div>
    <div id="sbvBar"><i id="sbvFill"></i></div>
    <div id="sbvStatus">Press play to start.</div>
  </div>
</div>

<script>
(function(){
  /* ===== Course name on the card -> YouTube link ===== */
  const VIDEOS = {
    "Graphic Design Fundamentals": "https://youtu.be/e_dv7GBHka8",
    "Web Development & Coding":    "https://youtu.be/nu_pCVPKzTk",
    "Digital Marketing":           "https://youtu.be/kunkYTKFNtI",
    "IT Support & Networking":     "https://youtu.be/vGjH9leVXaM",
    "UI/UX Design":                "https://youtu.be/Q34GJLt4FAY",
    "Cybersecurity Fundamentals":  "https://youtu.be/Asurd09LmCU"
  };
  const COMPLETE_AT = 0.9; // done at 90% watched
  const KEY = "skillbridge:progress";

  let progress; try{ progress = JSON.parse(localStorage.getItem(KEY)) || {done:{},time:{}}; }catch(e){ progress = {done:{},time:{}}; }
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }; // later: also save to Firebase/Supabase
  const vid = u => (u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];

  const $ = id => document.getElementById(id);
  let player = null, ready = false, pending = null, active = null, timer = null;

  function label(btn, name){ btn.textContent = progress.done[name] ? "✓ COMPLETED · WATCH AGAIN" : "WATCH VIDEO"; btn.classList.toggle("done", !!progress.done[name]); }

  function markDone(name){
    if(progress.done[name]) return;
    progress.done[name] = true; save();
    $("sbvStatus").textContent = "Course complete ✓";
    document.querySelectorAll(".sbv-btn").forEach(b => { if(b.dataset.course===name) label(b,name); });
    // Certificate step goes here later
  }

  function tick(){
    if(!player || !ready || !active || player.getPlayerState()!==1) return;
    const t = player.getCurrentTime(), d = player.getDuration(); if(!d) return;
    progress.time[active] = t; save();
    const pct = Math.round(t/d*100);
    $("sbvFill").style.width = pct+"%";
    if(!progress.done[active]) $("sbvStatus").textContent = "Watched "+pct+"%";
    if(t/d >= COMPLETE_AT) markDone(active);
  }

  function start(name){
    const id = vid(VIDEOS[name]), from = Math.floor(progress.time[name]||0);
    if(ready){ player.loadVideoById({videoId:id, startSeconds:from}); }
    else { pending = {videoId:id, startSeconds:from}; }
  }

  function open(name){
    active = name;
    $("sbvTitle").textContent = name;
    $("sbvFill").style.width = progress.done[name] ? "100%" : "0";
    $("sbvStatus").textContent = progress.done[name] ? "Course complete ✓" : "Press play to start.";
    $("sbvOverlay").classList.add("open");
    if(!player && !window.YT){
      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player("sbvPlayer", {
          playerVars:{rel:0, modestbranding:1, playsinline:1},
          events:{
            onReady:() => { ready = true; if(pending){ player.loadVideoById(pending); pending = null; } },
            onStateChange:e => { if(e.data===0 && active) markDone(active); }
          }
        });
        timer = setInterval(tick, 3000);
      };
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    }
    start(name);
  }

  function close(){
    $("sbvOverlay").classList.remove("open");
    if(ready && player.stopVideo) player.stopVideo();
    active = null;
  }

  $("sbvClose").onclick = close;
  $("sbvOverlay").addEventListener("click", e => { if(e.target.id==="sbvOverlay") close(); });
  document.addEventListener("keydown", e => { if(e.key==="Escape") close(); });

  /* Add a WATCH VIDEO button to every course card */
  document.querySelectorAll(".course-card").forEach(card => {
    const name = card.dataset.cartName;
    if(!VIDEOS[name]) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "sbv-btn"; b.dataset.course = name;
    label(b, name);
    b.onclick = () => open(name);
    card.appendChild(b);
  });
})();
</script>
<!-- ===== END VIDEO POPUP ===== -->
